name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  RUST_VERSION: 1.97.1

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Version declarations agree
        run: bun run version:check

      - name: Toolchain declarations agree
        run: bun run toolchains:check

  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check
      - run: bun run build
      - run: bun run notices:check
      - run: bun run sbom:generate "$RUNNER_TEMP/unfocus.cdx.json"
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - run: bun run dependencies:check
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: bun run dependencies:audit-rust

  platform-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, windows-2025]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [versions, check, dependency-audit, platform-check]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every CI job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          PLATFORM_CHECK_RESULT: ${{ needs.platform-check.result }}
          VERSIONS_RESULT: ${{ needs.versions.result }}
        run: |
          test "$VERSIONS_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$DEPENDENCY_AUDIT_RESULT" = success
          test "$PLATFORM_CHECK_RESULT" = success
