name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      rehearsal:
        description: Build and assemble release candidates without publishing
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.97.1

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release invocation
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REF: ${{ github.ref }}
          REHEARSAL: ${{ inputs.rehearsal }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" = true ]; then
            if [ "$EVENT_NAME" != pull_request ] || [ "$BASE_REF" != main ] || [ "$HEAD_REF" != dev ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
              echo "Release rehearsals are limited to this repository's dev-to-main promotion pull request." >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" != push ] || [[ "$REF" != refs/tags/v* ]]; then
            echo "Publishing release builds require a v-prefixed tag push." >&2
            exit 1
          fi

      - name: Require the tagged commit to belong to main
        if: ${{ !inputs.rehearsal }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Tag matches the declared version
        if: ${{ !inputs.rehearsal }}
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: bun run scripts/version.js check --expect "$EXPECTED_TAG"

      - name: Rehearsal version declarations agree
        if: ${{ inputs.rehearsal }}
        run: bun run version:check

      - name: Toolchain declarations agree
        run: bun run toolchains:check

      - name: Compose release notes
        env:
          REHEARSAL: ${{ inputs.rehearsal }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" = true ]; then
            TAG="v$(bun -e 'console.log(require("./package.json").version)')"
          fi
          bun run release:notes "$TAG" > /dev/null

      - name: Refuse to mutate an existing published release
        if: ${{ !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Listed rather than read from /releases/tags/$TAG: GitHub does not
          # attach a tag to a draft release until it is published, so the tag
          # endpoint 404s on drafts. Listing reports them, and any API failure
          # fails the step instead of reading as "no release".
          RELEASE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s -c --arg tag "$TAG" 'flatten(1) | map(select(.tag_name == $tag)) | first // empty')
          if [ -n "$RELEASE" ] && [ "$(jq -r .draft <<<"$RELEASE")" != "true" ]; then
            echo "A published release already exists for $TAG; publish a new version instead." >&2
            exit 1
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check
      - run: bun run build
      - run: bun run notices:check
      - run: bun run dependencies:check
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: bun run dependencies:audit-rust

      - name: Generate release dependency metadata
        run: |
          mkdir -p release-metadata
          bun run sbom:generate release-metadata/unfocus.cdx.json
          cp THIRD_PARTY_NOTICES.txt release-metadata/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-22.04
            target: ""
            args: -- --locked
          - name: windows-x86_64
            platform: windows-2025
            target: ""
            args: -- --locked
          - name: macos-aarch64
            platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin -- --locked
          - name: macos-x86_64
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin -- --locked
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev lintian

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - name: Build packages without release credentials
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Collect distributable bundles
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: bun run scripts/collect-release-artifacts.js release-artifacts

      - name: Qualify the finalized Debian package
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          mapfile -t DEBIAN_PACKAGES < <(find release-artifacts -maxdepth 1 -type f -name '*.deb' -print)
          if [ "${#DEBIAN_PACKAGES[@]}" -ne 1 ]; then
            echo "Expected exactly one Debian package, found ${#DEBIAN_PACKAGES[@]}." >&2
            exit 1
          fi
          bun run debian:verify "${DEBIAN_PACKAGES[0]}" "$VERSION"
          bun run debian:qualify-published "${DEBIAN_PACKAGES[0]}" "$VERSION" "$GITHUB_REPOSITORY"
          # This upstream desktop alpha has no CLI manual or Debian BTS bug,
          # and release symbols remain available for cross-platform diagnostics.
          lintian --fail-on error \
            --suppress-tags initial-upload-closes-no-bugs,no-manual-page,unstripped-binary-or-object \
            "${DEBIAN_PACKAGES[0]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      # Downloaded per artifact rather than merged: merge-multiple flattens
      # every job into one directory and a same-named asset from two platforms
      # would overwrite silently instead of failing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-downloads

      - name: Assemble and verify the release candidate
        run: bun run release:assemble release-downloads release-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: assemble
    if: ${{ !inputs.rehearsal && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: release-assets

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Compose release notes
        env:
          TAG: ${{ github.ref_name }}
        run: bun run release:notes "$TAG" > notes.md

      - name: Create or update a draft release
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          verify_remote_tag() {
            git fetch --no-tags origin "+refs/tags/$TAG:refs/remotes/origin/unfocus-release-tag"
            ACTUAL_SHA=$(git rev-parse "refs/remotes/origin/unfocus-release-tag^{commit}")
            if [ "$ACTUAL_SHA" != "$EVENT_SHA" ]; then
              echo "Remote tag $TAG moved from event commit $EVENT_SHA to $ACTUAL_SHA." >&2
              exit 1
            fi
          }

          # A draft release carries no tag association until it is published,
          # so /releases/tags/$TAG 404s on exactly the release this job just
          # created. List instead, and let any API failure fail the step
          # rather than read as "not created yet".
          lookup_release() {
            RELEASE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -s -c --arg tag "$TAG" 'flatten(1) | map(select(.tag_name == $tag)) | first // empty')
          }

          verify_remote_tag
          lookup_release

          # Both writes return the release they wrote, so take the id from the
          # response. The releases listing is cached and lagged the create by
          # a few hundred milliseconds, so reading back to learn the id raced
          # and failed; nothing below depends on the listing settling.
          CREATED=false
          if [ -z "$RELEASE" ]; then
            CREATED=true
            RELEASE=$(jq -n --arg tag "$TAG" --arg sha "$EVENT_SHA" \
              --arg name "Unfocus $TAG" --rawfile body notes.md \
              '{tag_name:$tag, target_commitish:$sha, name:$name, body:$body, draft:true, prerelease:true}' \
              | gh api "repos/$GITHUB_REPOSITORY/releases" -X POST --input -)
          elif [ "$(jq -r .draft <<<"$RELEASE")" = "true" ]; then
            ID=$(jq -r .id <<<"$RELEASE")
            RELEASE=$(jq -n --arg name "Unfocus $TAG" --rawfile body notes.md \
              '{name:$name, body:$body, draft:true, prerelease:true}' \
              | gh api "repos/$GITHUB_REPOSITORY/releases/$ID" -X PATCH --input -)
          else
            echo "Refusing to alter the published release for $TAG." >&2
            exit 1
          fi

          if [ "$(jq -r .draft <<<"$RELEASE")" != "true" ]; then
            echo "The release was published before its asset set could be reconciled." >&2
            exit 1
          fi
          ID=$(jq -r .id <<<"$RELEASE")
          [[ "$ID" =~ ^[0-9]+$ ]] || {
            echo "GitHub did not return a release id." >&2
            exit 1
          }

          # Only a reused draft can already hold assets, and only its id has
          # been readable long enough to list against.
          if [ "$CREATED" = "false" ]; then
            ASSET_IDS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$ID/assets?per_page=100" --jq '.[].id')
            if [ -n "$ASSET_IDS" ]; then
              while IFS= read -r ASSET_ID; do
                [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || {
                  echo "GitHub returned an invalid release asset ID." >&2
                  exit 1
                }
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" -X DELETE
              done <<<"$ASSET_IDS"
            fi
          fi

          verify_remote_tag
          # Uploaded by release id rather than `gh release upload "$TAG"`,
          # which would resolve the tag through that same lagging listing.
          UPLOADED=0
          for ASSET in release-assets/*; do
            [ -f "$ASSET" ] || continue
            NAME=$(basename "$ASSET")
            ENCODED=$(jq -rn --arg name "$NAME" '$name | @uri')
            echo "uploading $NAME"
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"$ASSET" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$ENCODED") || {
                echo "$RESPONSE" >&2
                echo "upload failed for $NAME" >&2
                exit 1
              }
            STATE=$(jq -r '.state // "missing"' <<<"$RESPONSE")
            if [ "$STATE" != "uploaded" ]; then
              echo "$NAME finished in state $STATE rather than uploaded." >&2
              exit 1
            fi
            UPLOADED=$((UPLOADED + 1))
          done

          # Counted from the upload responses, not from a fresh listing: the
          # per-asset state above is the authoritative confirmation and needs
          # no second read. `find` sees dotfiles the glob skips, so a staged
          # file that was never offered for upload still fails here.
          EXPECTED=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [ "$UPLOADED" -ne "$EXPECTED" ]; then
            echo "Uploaded $UPLOADED assets but staged $EXPECTED." >&2
            exit 1
          fi
          echo "uploaded $UPLOADED assets to release $ID"
