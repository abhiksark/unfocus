name: Dispatch APT alpha update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published alpha tag to redispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apt-alpha-dispatch-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name != 'release' || contains(github.event.release.tag_name, '-alpha.')
    runs-on: ubuntu-24.04
    environment: apt-repo-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve a published alpha release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE: ${{ toJSON(github.event.release) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.(0|[1-9][0-9]*)$'

          if [ "$EVENT_NAME" = release ]; then
            RELEASE=$(jq -c . <<<"$EVENT_RELEASE")
          else
            [[ "$INPUT_TAG" =~ $TAG_PATTERN ]] || {
              echo "Manual retries require an exact vX.Y.Z-alpha.N tag." >&2
              exit 1
            }
            RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG")
          fi

          ID=$(jq -r '.id // empty' <<<"$RELEASE")
          TAG=$(jq -r '.tag_name // empty' <<<"$RELEASE")
          TARGET_COMMITISH=$(jq -r '.target_commitish // empty' <<<"$RELEASE")
          DRAFT=$(jq -r '.draft | if type == "boolean" then tostring else empty end' <<<"$RELEASE")
          PRERELEASE=$(jq -r '.prerelease | if type == "boolean" then tostring else empty end' <<<"$RELEASE")
          PUBLISHED_AT=$(jq -r '.published_at // empty' <<<"$RELEASE")

          [[ "$ID" =~ ^[0-9]+$ ]] || {
            echo "GitHub did not return a numeric release id." >&2
            exit 1
          }
          [[ "$TAG" =~ $TAG_PATTERN ]] || {
            echo "Release tag $TAG is not an exact alpha version." >&2
            exit 1
          }
          [[ "$TARGET_COMMITISH" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release target_commitish must be an exact lowercase commit SHA." >&2
            exit 1
          }
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$TAG" != "$INPUT_TAG" ]; then
            echo "GitHub returned tag $TAG for requested tag $INPUT_TAG." >&2
            exit 1
          fi
          if [ "$DRAFT" != false ] || [ "$PRERELEASE" != true ] || [ -z "$PUBLISHED_AT" ]; then
            echo "$TAG is not a published, non-draft prerelease." >&2
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          TARGET_COMMIT=$(git rev-parse --verify "${TARGET_COMMITISH}^{commit}")
          [ "$TARGET_COMMIT" = "$TARGET_COMMITISH" ] || {
            echo "Release target_commitish did not resolve to its exact commit." >&2
            exit 1
          }
          git merge-base --is-ancestor "$TARGET_COMMIT" refs/remotes/origin/main || {
            echo "Release target_commitish is not on origin/main." >&2
            exit 1
          }
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          TAG_COMMIT=$(git rev-parse --verify "${TAG}^{commit}")
          [ "$TAG_COMMIT" = "$TARGET_COMMIT" ] || {
            echo "$TAG does not point to the release target commit." >&2
            exit 1
          }

          {
            echo "release_id=$ID"
            echo "tag_name=$TAG"
            echo "target_commit=$TARGET_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch the apt repository update
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          TARGET_COMMIT: ${{ steps.release.outputs.target_commit }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || {
            echo "APT_DISPATCH_TOKEN is required in the apt-repo-automation environment." >&2
            exit 1
          }
          git fetch --no-tags origin "+refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          TAG_COMMIT=$(git rev-parse --verify "${TAG_NAME}^{commit}")
          [ "$TAG_COMMIT" = "$TARGET_COMMIT" ] || {
            echo "$TAG_NAME moved after release validation; refusing to dispatch." >&2
            exit 1
          }
          jq -n \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --argjson release_id "$RELEASE_ID" \
            --arg tag_name "$TAG_NAME" \
            '{
              event_type: "unfocus-alpha-published",
              client_payload: {
                source_repository: $source_repository,
                release_id: $release_id,
                tag_name: $tag_name
              }
            }' \
            | gh api --method POST "repos/abhiksark/unfocus-apt/dispatches" --input -
