[package]
name = "unfocus"
version = "0.6.0-beta.2"
description = "Local-first break and reflection app"
authors = ["Unfocus contributors <14940119+abhiksark@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unfocus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Opt-in Sway 1.11+ Wayland candidate (issue #25). Off in packaged builds.
# Does not claim multi-monitor or release qualification.
wayland-sway = ["dep:wayland-client", "dep:wayland-protocols", "dep:rustix"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["screensaver"] }
# Optional: enabled only by the wayland-sway feature on Linux targets.
rustix = { version = "1", default-features = false, features = ["process", "std"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", default-features = false, features = [
  "client",
  "staging",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3"
objc2-core-foundation = { version = "0.3", features = [
  "CFArray",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel.git", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
